<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoAlert</title>

  <link rel="stylesheet" href="geoalertstyle.css">

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

  <header>
    <h1>GeoAlert</h1>
  </header>

  <main class="container">

    <!-- LADO ESQUERDO -->
    <section class="left-side">
      <img src="assets/images/onibus.jpg" alt="Ônibus">
    </section>

    <!-- LADO DIREITO -->
    <section class="right-side">

      <div class="bus-icon">
        <img src="assets/images/onibus_silhueta.png" alt="Ícone ônibus">
      </div>

      <div class="input-box">
        <label>Destino:</label>
        <input type="text" placeholder="Selecionar destino">
      </div>

      <div class="input-box">
        <label>Raio:</label>
        <input type="text" placeholder="Selecionar raio">
      </div>

      <div class="line"></div>
      <button>Iniciar viagem</button>

    </section>

  </main>

</body>
</html>
